.hero-content{position:relative;padding:24px 47px;color:var(--ink)}
.hero-content h1{font-size:28px;line-height:1.35;margin:0 0 6px;font-weight:900;letter-spacing:.1px}
.hero-content p{font-size:14px;line-height:1.42;margin:2px 0;color:#5b6b88;font-weight:500}
.search-panel{height:204px;padding:16px 19px 13px;margin-bottom:12px}
#jobFilterForm{height:100%;display:flex;flex-direction:column}
.search-primary{display:grid;grid-template-columns:54px minmax(0,1fr) 52px 338px;gap:13px;align-items:center;height:39px}
.search-primary>label{font-weight:800;font-size:13px;color:#213154}
.search-primary>label:nth-child(3){text-align:right;margin-right:10px}
.control,.select-wrap select,.salary-inputs input{border:1px solid #e0e7f1;background:#fff;height:37px;border-radius:6px;font-size:12px;color:#465878;box-shadow:0 1px 2px #d9e0ec0a}
.control:focus-within,.select-wrap:focus-within select,.salary-inputs input:focus{border-color:#6b9fff;outline:2px solid #dfeaff}
.keyword-box{display:flex;align-items:center;gap:9px;padding:0 12px;color:#a8b5ca}
.keyword-box .icon{width:17px;height:17px;stroke-width:1.8}
.keyword-box input{width:100%;height:100%;border:0;outline:0;background:transparent;font-size:12px;color:#344967}
input::placeholder{color:#aab7cf;opacity:1}
.select-wrap{position:relative;flex:1;min-width:0}
.select-wrap:after{content:'';position:absolute;right:18px;top:50%;width:6px;height:6px;border-right:1.7px solid #61799e;border-bottom:1.7px solid #61799e;transform:translateY(-65%) rotate(45deg);pointer-events:none}
.select-wrap select{width:100%;appearance:none;padding:0 36px 0 13px;cursor:pointer;color:#71819d}
.filter-row{display:grid;grid-template-columns:196px 201px 230px minmax(0,1fr) 143px;align-items:end;gap:19px;margin-top:16px}
.filter-group{font-size:13px;font-weight:800;color:#233353;display:flex;flex-direction:column;gap:6px;white-space:nowrap}
.filter-group .select-wrap select{height:38px;font-weight:500}
.salary-inputs{display:flex;align-items:center;gap:14px;position:relative;flex:1}
.salary-inputs input{width:calc(50% - 17px);padding:0 11px;min-width:0}
.salary-inputs>span:not(.salary-unit){font-size:20px;color:#a1adc2}
.salary-unit{position:absolute;right:10px;font-size:12px;color:#7486a3}
.salary-inputs input:last-of-type{padding-right:25px}
.filter-actions{height:65px;display:flex;flex-direction:column;gap:8px;align-items:stretch;padding-top:4px}
.search-cta{background:#276dff;color:white;border-radius:5px;height:41px;padding:0 18px;white-space:nowrap;font-weight:800;box-shadow:0 3px 9px #1e68ff20}
.search-cta:hover{background:#155ce9}
.reset-btn{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:12px;color:#8796b1;padding:0 2px}
.reset-btn .icon{width:13px;height:13px;stroke-width:2.3}
.reset-btn:hover{color:#2472ff}
.hot-row{display:flex;align-items:center;gap:12px;margin-top:auto;margin-bottom:0;min-width:0;white-space:nowrap}
.hot-row>span{font-size:12px;color:#34415e;font-weight:800;flex-shrink:0}
.popular-tags{display:flex;gap:9px;min-width:0;align-items:center;overflow:hidden}
.popular-tags button{border-radius:20px;background:#f0f5fb;color:#63799e;line-height:25px;height:26px;padding:0 14px;font-size:11px;font-weight:700;white-space:nowrap}
.popular-tags button:hover,.popular-tags button.selected{background:#e2edff;color:#246fff}
.popular-tags .more-hot{background:#edf3ff;color:#246afa;padding:0 11px}
.results-meta{height:51px;display:flex;align-items:center;justify-content:space-between}
.results-heading{font-size:15px;font-weight:800;color:#263657;display:flex;align-items:baseline;gap:5px}
.results-heading strong{font-size:25px;color:#1d72ff;letter-spacing:.4px;font-weight:900}
.applied-filters{display:flex;gap:10px;align-items:center;min-width:0}
.applied-filters>span{color:#435573;font-size:12px;font-weight:700}
#activeChips{display:flex;align-items:center;gap:8px;overflow:hidden}
.chip{height:27px;padding:0 11px;border-radius:18px;background:#eaf2ff;color:#3580ff;font-size:12px;font-weight:700;white-space:nowrap}
.chip:hover{background:#d5e6ff}
.applied-filters>#clearChips{font-size:12px;color:#367aff;font-weight:700;white-space:nowrap;padding:0 8px}
.sort-bar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 8px;margin-bottom:10px;gap:12px}
.sort-tabs{height:100%;display:flex;gap:28px;align-items:stretch}
.sort-tabs button{font-size:13px;font-weight:700;color:#7887a4;padding:0 14px;position:relative;white-space:nowrap}
.sort-tabs button.active{color:#176aff;font-weight:800}
.sort-tabs button.active:after{content:'';position:absolute;bottom:4px;height:3px;border-radius:3px;background:#357dff;left:12px;right:12px}
.view-modes{display:flex;align-items:center;background:#f4f6fa;border-radius:5px;padding:3px;gap:3px}
.view-modes button{height:34px;display:flex;align-items:center;gap:5px;color:#7e89a1;border-radius:4px;padding:0 12px;font-size:12px;white-space:nowrap}
.view-modes button.active{background:#246dff;color:white;box-shadow:0 3px 8px #2165ff28}
.view-modes .icon{width:16px;height:16px;stroke-width:2}
.job-results{display:flex;flex-direction:column;gap:9px}
.job-card{height:106px;position:relative;background:#fff;border:1px solid #edf0f6;box-shadow:0 3px 12px #4162a10a;border-radius:11px;transition:box-shadow .2s,transform .2s;overflow:hidden}
.job-card:hover{box-shadow:0 6px 18px #396fa01b;transform:translateY(-1px);border-color:#dbe9ff}
.company-logo{position:absolute;left:14px;top:13px;width:72px;height:72px;display:block;object-fit:contain;border:1px solid #eaf0f8;border-radius:12px;background:#fff}
.tencent-logo-fallback{position:absolute;left:14px;top:13px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid #eaf0f8;color:#1c67d5;font-weight:900;font-style:italic;font-size:14px;font-family:Georgia,Arial}
.job-main{position:absolute;left:106px;top:12px;width:350px}
.job-head{display:flex;gap:11px;align-items:center;height:25px;white-space:nowrap}
.job-head strong{color:#111d3c;font-size:15px;font-weight:900;text-overflow:ellipsis;overflow:hidden}
.job-campus{display:inline-block;font-style:normal;background:#ecf3ff;color:#3581ff;font-size:11px;padding:2px 9px;border-radius:9px;font-weight:800;flex-shrink:0}
.job-company{margin-top:1px;color:#8291aa;white-space:nowrap;font-size:12px;max-width:330px;overflow:hidden;text-overflow:ellipsis}
.job-company span{padding:0 7px;color:#ccd3df}
.job-tags{margin-top:9px;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden}
.job-tags span{background:#f0f4fa;color:#71809e;padding:3px 10px;border-radius:5px;font-size:11px;line-height:17px;white-space:nowrap}
.job-tags span:first-child{color:#2774fc;background:#e9f1ff;font-weight:800}
.job-location{position:absolute;left:464px;top:15px;width:150px;display:flex;flex-direction:column;gap:7px;color:#8a9bb5;font-size:11px}
.job-location div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.job-location svg{width:15px;height:15px;color:#91a1b9;stroke-width:1.8}
.job-salary{position:absolute;left:625px;top:12px;color:#ff5f27;font-size:17px;font-weight:900;letter-spacing:.3px;white-space:nowrap}
.job-salary small{font-size:12px;font-weight:900}
.job-score{position:absolute;left:772px;top:16px;width:116px;display:flex;flex-direction:column;gap:6px}
.job-score .score-line{display:flex;gap:5px;align-items:center;white-space:nowrap}
.job-score .icon{height:17px;width:17px;fill:#14c88b;stroke:white;stroke-width:2.1}
.job-score strong{font-size:15px;color:#09bd87;font-weight:900}
.job-score span{font-size:11px;color:#a1abc0}
.score-meter{width:98px;height:7px;background:#e4eaf0;border-radius:10px;overflow:hidden}
.score-meter i{display:block;height:100%;background:#20c68e;border-radius:10px}
.job-actions{position:absolute;right:15px;top:16px;display:flex;gap:9px}
.job-actions button{width:95px;height:35px;border:1px solid #6e9bff;border-radius:5px;color:#246dff;font-size:12px;font-weight:800;background:#fff}
.job-actions button.primary{background:#286bff;color:#fff;border-color:#286bff}
.job-actions button.primary svg{width:14px;height:14px;stroke-width:2.1;vertical-align:-3px;margin-right:3px}
.job-actions button.added{background:#e7fbf5;border-color:#32c992;color:#00a976}
.job-description{position:absolute;left:625px;right:13px;top:64px;font-size:11px;line-height:1.55;color:#8796b0;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.job-results.grid-view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.job-results.grid-view .job-card{height:236px}
.job-results.grid-view .job-main{top:15px;left:100px;width:calc(100% - 112px)}
.job-results.grid-view .job-location{top:104px;left:18px;gap:5px}
.job-results.grid-view .job-salary{left:auto;right:20px;top:105px}
.job-results.grid-view .job-score{left:18px;top:155px}
.job-results.grid-view .job-actions{top:176px;right:15px}
.job-results.grid-view .job-description{left:180px;top:140px;right:12px;max-height:40px}
.job-results.grid-view .job-tags{margin-top:15px;flex-wrap:wrap;max-height:52px;white-space:normal}
.page-bottom{padding:20px 5px 50px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#99a6bd}
.show-more{color:#387bfa;border:1px solid #d5e4ff;padding:10px 16px;border-radius:7px;background:white}.show-more .icon{width:12px;height:12px;vertical-align:-2px}
.empty-jobs{background:#fff;border-radius:11px;padding:55px 20px;text-align:center;color:#7f8da5;font-size:13px}
.popover-mask{position:fixed;inset:0;background:#11265081;z-index:35}
.job-detail-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:16px;padding:26px 30px;background:#fff;z-index:40;width:min(560px,calc(100vw - 32px));box-shadow:0 22px 65px #19396035}
.job-detail-modal[hidden],.popover-mask[hidden]{display:none}
.modal-close{position:absolute;top:8px;right:17px;font-size:28px;color:#72809a}
.modal-head{display:flex;gap:17px;align-items:center}.modal-head img{width:70px;height:70px;object-fit:contain;border:1px solid #edf1f6;border-radius:12px}.modal-head h2{font-size:20px;margin:0 0 8px}.modal-head p{margin:0;color:#8997ac}
.modal-salary{color:#ff6b30;font-weight:900;font-size:20px}.modal-tags{display:flex;gap:7px;flex-wrap:wrap}.modal-tags span{border-radius:5px;background:#f0f5fc;padding:4px 8px;color:#607499}

    {id:2,title:'算法工程师（NLP方向）',company:'阿里巴巴集团',companyType:'互联网',size:'10000人以上',logo:'logo-alibaba.png',city:'杭州',district:'西湖区',date:'2024-10-18',salary:25,maxSalary:40,months:16,score:88,education:'硕士',type:'算法工程师',tags:['硕士及以上','自然语言处理','深度学习','Python','大模型','算法优化'],desc:'从事大模型相关的算法研发工作，探索AIGC在电商、搜索等场景的应用。要求扎实的机器学习和深度学习基础，有相关论文或项目经历者优先。'},
    {id:3,title:'软件开发工程师',company:'华为技术有限公司',companyType:'通信/硬件',size:'10000人以上',logo:'logo-huawei.png',city:'深圳',district:'龙岗区',date:'2024-10-17',salary:18,maxSalary:30,months:15,score:85,education:'本科',type:'软件开发',tags:['本科及以上','Java','分布式系统','微服务','数据库','Linux'],desc:'参与公司核心产品的研发工作，负责模块设计、编码实现与测试。要求计算机相关专业基础扎实，熟悉Java或C++，具备良好的工程能力和团队协作精神。'},
    {id:4,title:'前端开发工程师',company:'腾讯科技',companyType:'互联网',size:'10000人以上',logo:'logo-tencent.png',city:'深圳',district:'南山区',date:'2024-10-16',salary:18,maxSalary:28,months:16,score:83,education:'本科',type:'前端开发',tags:['本科及以上','前端开发','React','TypeScript','工程化','性能优化'],desc:'负责腾讯云产品前端研发，参与大型中台系统的建设。要求熟悉前端基础知识，掌握React/Vue等主流框架，具备良好的代码质量意识和问题解决能力。'},
    {id:5,title:'数据分析师',company:'美团',companyType:'互联网',size:'10000人以上',logo:'logo-meituan.png',city:'北京',district:'朝阳区',date:'2024-10-15',salary:15,maxSalary:25,months:14,score:80,education:'本科',type:'数据分析',tags:['本科及以上','Python','SQL','数据分析','商业分析'],desc:'负责业务数据分析、指标体系搭建和数据可视化，使用SQL及Python完成数据处理，协助业务团队进行产品优化和增长决策。'},
    {id:6,title:'Java后端开发工程师',company:'字节跳动',companyType:'互联网',size:'10000人以上',logo:'logo-bytedance.png',city:'北京',district:'海淀区',date:'2024-10-13',salary:20,maxSalary:32,months:15,score:79,education:'本科',type:'后端开发',tags:['本科及以上','Java','MySQL','分布式系统','Redis'],desc:'参与业务服务端模块开发，完成接口设计、数据库建模及性能优化，支持高可用、高并发系统。'},
    {id:7,title:'Python数据开发工程师',company:'阿里巴巴集团',companyType:'互联网',size:'10000人以上',logo:'logo-alibaba.png',city:'杭州',district:'西湖区',date:'2024-10-12',salary:18,maxSalary:31,months:16,score:78,education:'本科',type:'后端开发',tags:['本科及以上','Python','数据分析','大数据','Linux'],desc:'参与数据平台建设和数据服务接口开发，支持业务智能化分析和数据治理。'},
    {id:8,title:'软件测试开发工程师',company:'华为技术有限公司',companyType:'通信/硬件',size:'10000人以上',logo:'logo-huawei.png',city:'深圳',district:'龙岗区',date:'2024-10-11',salary:16,maxSalary:25,months:14,score:75,education:'本科',type:'软件开发',tags:['本科及以上','软件测试','Python','自动化测试','Linux'],desc:'负责测试平台及自动化工具开发，参与持续集成和质量保障体系建设。'}
  ];
  const state={sort:'综合排序',view:'list',query:{},chips:['北京','本科','产品经理'], expanded:false,selected:new Set(), current:null};
  const logoURI = (filename) => (window.__embeddedAssets && window.__embeddedAssets[filename]) || `assets/${filename}`;
  const icon=(id,extra='') => `<svg class="icon" ${extra}><use href="#i-${id}"></use></svg>`;
  function toast(message){const node=$('#toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>node.classList.remove('show'),2600)}
  function scoreIcon(){return icon('circle-check')}
  function card(j){
    const safe=escapeHTML;
    const companyLogo=`<img class="company-logo" loading="lazy" src="${safe(logoURI(j.logo))}" alt="${safe(j.company)}标识">`;
    const dateParts=j.date.split('-');
    return `<article class="job-card" data-job="${j.id}">
      ${companyLogo}
      <div class="job-main"><div class="job-head"><strong>${safe(j.title)}</strong><span class="job-campus">校招</span></div>
      <div class="job-company">${safe(j.company)}<span>|</span>${safe(j.companyType)}<span>|</span>${safe(j.size)}</div>
      <div class="job-tags">${j.tags.map(t=>`<span>${safe(t)}</span>`).join('')}</div></div>
      <div class="job-location"><div>${icon('location')}${safe(j.city)} · ${safe(j.district)}</div><div>${icon('clock')}${safe(j.date)} 发布</div></div>
      <div class="job-salary">${j.salary}-${j.maxSalary}K · <small>${j.months}薪</small></div>
      <div class="job-score"><div class="score-line">${scoreIcon()}<strong>${j.score}%</strong><span>匹配度</span></div><div class="score-meter"><i style="width:${j.score}%"></i></div></div>
      <div class="job-actions"><button type="button" data-detail="${j.id}">查看详情</button><button type="button" class="primary ${state.selected.has(j.id)?'added':''}" data-match="${j.id}">${icon(state.selected.has(j.id)?'check':'paper')}${state.selected.has(j.id)?'已加入':'加入匹配'}</button></div>
      <div class="job-description">${safe(j.desc)}</div></article>`;
  }
  function filteredJobs(){
    const f=state.query; let v=jobs.slice();
    if(f.keyword){const k=f.keyword.toLowerCase();v=v.filter(j=>(j.title+j.company+j.type+j.city+j.tags.join(' ')+j.desc).toLowerCase().includes(k));}
    if(f.city)v=v.filter(j=>j.city===f.city);
    if(f.category)v=v.filter(j=>j.type===f.category||j.title.includes(f.category));
    if(f.education)v=v.filter(j=>j.education===f.education||(f.education==='本科'&&j.tags.includes('本科及以上')));
    if(f.skill)v=v.filter(j=>j.tags.some(t=>t.toLowerCase().includes(f.skill.toLowerCase())));
    if(Number.isFinite(f.min))v=v.filter(j=>j.maxSalary>=f.min);
    if(Number.isFinite(f.max))v=v.filter(j=>j.salary<=f.max);
    if(state.sort==='最新发布')v.sort((a,b)=>b.date.localeCompare(a.date));
    if(state.sort==='薪资从高到低')v.sort((a,b)=>b.salary-a.salary);
    if(state.sort==='薪资从低到高')v.sort((a,b)=>a.salary-b.salary);
    if(state.sort==='匹配度从高到低')v.sort((a,b)=>b.score-a.score);
    return v;
  }
  function renderChips(){
    $('#activeChips').innerHTML=state.chips.map(c=>`<button class="chip" data-chip="${escapeHTML(c)}" type="button">${escapeHTML(c)} ×</button>`).join('');
    $('#activeChips').querySelectorAll('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state.chips=state.chips.filter(x=>x!==b.dataset.chip);if($('#city').value===b.dataset.chip)$('#city').value='';if($('#education').value===b.dataset.chip)$('#education').value='';if($('#category').value===b.dataset.chip)$('#category').value='';state.query=readForm();render();}));
  }
  function render(){
    let v=filteredJobs();if(!state.expanded)v=v.slice(0,5);
    $('#jobResults').classList.toggle('grid-view',state.view==='grid');
    $('#jobResults').innerHTML=v.length?v.map(card).join(''):'<div class="empty-jobs">没有符合当前条件的演示岗位，请调整筛选条件。</div>';
    const isDefault=Object.keys(state.query).length===0 || !Object.values(state.query).some(x=>x!==''&&x!==undefined&&x!==null&&x!==false);
    $('#resultCount').textContent=isDefault?'1,286':filteredJobs().length.toLocaleString('zh-CN');
    $('#showMoreJobs').textContent=state.expanded?'收起岗位':'加载更多岗位';
    $('#showMoreJobs').style.visibility=(filteredJobs().length>5)?'visible':'hidden';
    renderChips();
    $('#jobResults').querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>openDetail(+b.dataset.detail)));
    $('#jobResults').querySelectorAll('[data-match]').forEach(b=>b.addEventListener('click',()=>toggleMatch(+b.dataset.match)));
  }
  function readForm(){
    const raw={keyword:$('#keyword').value.trim(),city:$('#city').value,category:$('#category').value,education:$('#education').value,skill:$('#skill').value};
    if($('#salaryMin').value!=='')raw.min=Number($('#salaryMin').value);
    if($('#salaryMax').value!=='')raw.max=Number($('#salaryMax').value);
    return raw;
  }
  function applySearch(){
    const f=readForm();
    if(f.min!==undefined&&f.max!==undefined&&f.min>f.max){toast('最低薪资不能高于最高薪资');return;}
    state.query=f;state.expanded=false;state.chips=[f.city,f.education,f.category,f.skill,f.keyword].filter(Boolean);
    if(f.min!==undefined||f.max!==undefined)state.chips.push(`${f.min??0}–${f.max??'不限'}K`);
    render();toast(`筛选完成：找到 ${filteredJobs().length} 条演示岗位`);
  }
  function clearFilters(){
    $('#jobFilterForm').reset();state.query={};state.chips=[];state.expanded=false;
    $('#popularTags').querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
    render();toast('筛选条件已重置');
  }
  function toggleMatch(id){
    if(state.selected.has(id)){state.selected.delete(id);toast('已从匹配清单移除');}
    else{state.selected.add(id);toast('已加入匹配清单（演示模式）');}
    render();if(!$('#jobModal').hidden)$('#modalMatch').textContent=state.selected.has(id)?'移出匹配':'加入匹配';
  }
  function openDetail(id){
    const j=jobs.find(x=>x.id===id);if(!j)return;state.current=j.id;
    $('#modalLogo').src=logoURI(j.logo);$('#modalLogo').alt=j.company;
    $('#jobModalTitle').textContent=j.title;$('#modalCompany').textContent=`${j.company} · ${j.city} · ${j.district} · ${j.education}及以上`;
    $('#modalSalary').textContent=`${j.salary}-${j.maxSalary}K · ${j.months}薪 · 匹配度 ${j.score}%`;
    $('#modalTags').innerHTML=j.tags.map(t=>`<span>${escapeHTML(t)}</span>`).join('');$('#modalDescription').textContent=j.desc;
    $('#modalMatch').textContent=state.selected.has(id)?'移出匹配':'加入匹配';
    $('#mask').hidden=false;$('#jobModal').hidden=false;$('#closeModal').focus();document.body.style.overflow='hidden';
  }
  function closeDetail(){ $('#mask').hidden=true;$('#jobModal').hidden=true;document.body.style.overflow='';}
  $('#jobFilterForm').addEventListener('submit',e=>{e.preventDefault();applySearch();});
  $('#resetFilters').addEventListener('click',clearFilters);
  $('#clearChips').addEventListener('click',clearFilters);
  $('#sortTabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.sort=b.dataset.sort;$('#sortTabs').querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',x===b?'true':'false')});render();}));
  $('.view-modes').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;$('.view-modes').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render();}));
  $('#popularTags').querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{const tag=b.dataset.tag;$('#keyword').value=tag;b.classList.add('selected');applySearch()}));
  $('#moreTags').addEventListener('click',()=>toast('可通过关键词直接搜索更多热门标签'));
  $('#showMoreJobs').addEventListener('click',()=>{state.expanded=!state.expanded;render();});
  $('#closeModal').addEventListener('click',closeDetail);$('#mask').addEventListener('click',closeDetail);
  $('#modalMatch').addEventListener('click',()=>state.current&&toggleMatch(state.current));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
  $('#globalSearchForm').addEventListener('submit',e=>{e.preventDefault();$('#keyword').value=$('#globalSearch').value;applySearch();$('#jobs').scrollIntoView({behavior:'smooth'});});
  const menus=[['#notificationToggle','#notificationMenu'],['#profileToggle','#profileMenu']];
  for(const [btnSel,menuSel] of menus){const btn=$(btnSel),menu=$(menuSel);btn.addEventListener('click',e=>{e.stopPropagation();const wasOpen=!menu.hidden;menus.forEach(([b,m])=>{$(m).hidden=true;$(b).setAttribute('aria-expanded','false')});menu.hidden=wasOpen;btn.setAttribute('aria-expanded',String(!wasOpen));});}
  document.addEventListener('click',e=>{if(!e.target.closest('.popover-host')){menus.forEach(([b,m])=>{$(m).hidden=true;$(b).setAttribute('aria-expanded','false')});}});
  document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();toast(`“${b.dataset.demo}”可在系统完整版本中跳转；当前展示岗位探索复刻页面`)}));
  render();
})();
</script>
