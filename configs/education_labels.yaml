# 学历标签规范（第三阶段 3.2.2 / 3.3.3）
# ============================================================
# 事实基础（实测，见 reports/data-preprocessing.md）：
#   * 原始 assistant / 人工正确结果 的 token 词表实际只有 6 个合法 token
#     （本科/硕士/博士/大专/学历不限/学历不明）+ 极少量越界 token。
#   * 标签是 "可接受学历集合"，按从高到低用 "、" 连接，例如 "博士、硕士、本科"。
#   * 输入 <学历描述> 槽位里会出现 "本科及以上" 这类表达。
#
# 重要约束：
#   "X及以上" 展开成哪些标签，不由代码作者拍脑袋决定。
#   本文件的 above_expansion 规则来源于对 19.7 万 + 4.6 万条**伪标注数据**的
#   实测条件分布（P(标签 | 槽位表达)），并标注为 pseudo_convention（来源系统惯例），
#   不是人工标注规范。人工金标准 736 条不做任何规则拟合，只做一次性评估。
# ============================================================

label_order: ["博士", "硕士", "本科", "大专", "学历不限", "学历不明"]
label_index: {博士: 0, 硕士: 1, 本科: 2, 大专: 3, 学历不限: 4, 学历不明: 5}

# 学历层级（用于 "及以上" 展开）；学历不限/学历不明 不参与层级比较
degree_rank: {博士: 4, 硕士: 3, 本科: 2, 大专: 1}

# 同义表达 -> 规范 token（严格精确匹配，不做子串包含判断）
canonical_tokens:
  博士: ["博士", "博士生", "博士研究生", "研究生博士", "ph.d", "phd", "doctor"]
  硕士: ["硕士", "硕士生", "硕士研究生", "研究生硕士", "master", "mba"]
  本科: ["本科", "大学本科", "本科学历", "学士", "bachelor"]
  大专: ["大专", "专科", "高职", "大专学历", "专科学历", "associate"]
  学历不限: ["学历不限", "不限", "无学历要求", "学历要求不限", "学历无要求"]
  学历不明: ["学历不明", "学历未知", "无法确定", "未知", ""]

# 学历层级同义（用于识别 "X及以上" 中的 X）
degree_synonyms:
  博士: ["博士", "博士研究生", "博士生"]
  硕士: ["硕士", "硕士研究生", "硕士研究生毕业", "研究生"]
  本科: ["本科", "大学本科", "学士"]
  大专: ["大专", "专科", "高职"]

above_expansion:
  policy: "pseudo_convention"
  evidence: >-
    见 reports/baselines/education-baselines.md 的 "slot->label 条件分布" 表。
    该展开方式来自 default/train 与 default/validation 的伪标注数据实测，
    支持度与一致率在构建阶段记录；未使用 736 条人工金标准做任何拟合或调参。
  rules:
    "X及以上": "expand_all_levels_ge(X)"     # 例：本科及以上 -> [本科, 硕士, 博士]
    "X以上":   "expand_all_levels_ge(X)"
    "X或以上": "expand_all_levels_ge(X)"
    "X学历以上": "expand_all_levels_ge(X)"
  exclusivity: >-
    "学历不限" 与 "学历不明" 是互斥的终态 token，不参与层级展开；
    同一样本不会同时出现层级 token 与 "学历不限"。若出现，标记 label_conflict。

unresolved_token_policy:
  action: "keep_and_flag"
  description: >-
    无法映射到 6 token 词表的表达（如 "大四保研准硕士"）不得强行归并。
    保留原始 token 写入 unresolved_tokens，样本 label_status 标记 oov_token，
    评估时计入错误类型 OOV_TOKEN，并单独报告。

confidence:
  human_gold: "high"          # annotated/2w_0716_eval.csv 的 人工正确结果（736 条）
  pseudo_online: "low"        # default/* 的 assistant（线上旧系统输出，人工复核一致率 45.92%）
  model_new: "unusable"       # annotated 的 模型结果-新的（含长文本噪声，不在词表内）

# 任务范围的准确表述（避免夸大）
task_scope_statement: >-
  实测输入 user = <岗位名称>…</岗位名称><岗位描述>…</岗位描述><学历描述>…</学历描述>，
  其中 <学历描述> 是一个已被上游抽取出来的短槽位（中位长度 2 字符）。
  因此本数据可支撑的任务是 "学历要求表达的规范化 / 槽位校验与多标签归一"，
  不是 "从完整招聘 JD 端到端抽取学历要求"。报告中不得使用后者表述。
