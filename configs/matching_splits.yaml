# 人岗匹配数据切分协议（第三阶段 3.2.1）
# 原则：绝不行级随机划分；一切随机过程由 configs/data_pipeline.yaml 的 seeds 提供。

default_ratios:
  train: 0.8
  validation: 0.1
  test: 0.1

# 组内排序评估的最小可评估组大小：
# 只有 1 条观测记录的候选人/岗位无法形成组内排序，单独统计但不计入排序指标。
min_group_size_for_ranking: 2

protocols:
  # 协议 A：Candidate Cold-start（主评估协议）
  candidate_cold:
    id: "A"
    name: "Candidate Cold-start"
    group_keys: ["candidate_id"]
    seed_key: "split_candidate_cold"
    ratios: {train: 0.8, validation: 0.1, test: 0.1}
    enforce:
      candidate_overlap: 0
      job_overlap: "not_required"   # 岗位允许跨集合出现
      pair_overlap: 0
    description: "候选人 ID 在三个集合间完全互斥；同一候选人的全部匹配记录只进入一个集合。"

  # 协议 B：Job Cold-start
  job_cold:
    id: "B"
    name: "Job Cold-start"
    group_keys: ["job_id"]
    seed_key: "split_job_cold"
    ratios: {train: 0.8, validation: 0.1, test: 0.1}
    enforce:
      candidate_overlap: "not_required"  # 候选人允许跨集合出现
      job_overlap: 0
      pair_overlap: 0
    description: "岗位 ID 在三个集合间完全互斥；同一岗位的全部匹配记录只进入一个集合。"

  # 协议 C：Double Cold-start
  double_cold:
    id: "C"
    name: "Double Cold-start"
    group_keys: ["candidate_id", "job_id"]
    seed_key: "split_double_cold"
    ratios: {train: 0.8, validation: 0.1, test: 0.1}
    assignment_strategy: "eval_first_greedy"
    # 策略参数（全部确定性，种子取自 seeds.split_double_cold）
    strategy_params:
      # 每个次要集合（validation / test）允许消耗的训练边损失预算，占原始边数的比例。
      # 实测扫描（seed=20261030）：0.05→保留 70.0%/可排序组 394-359；0.10→60.0%/739-717；
      # 0.15→50.0%/886-816；0.20→40.0%/927-803。取 0.10 作为保留率与可评估性的折中。
      budget_ratio_per_minor_split: 0.10
      # 可排序性目标：贪心优先把候选人补到这个观测条数，再考虑下一个。
      eval_soft_target: 5
      # gain 的平方缺口权重指数：2 表示越缺越重要（(target-kept)^2）。
      gain_deficit_power: 2
    assignment_strategy_note: >-
      两阶段确定性分配：阶段 1 先把主要实体（candidate_id）按观测边数贪心分配到 80/10/10
      （组完整、边不拆）；阶段 2 再分配次要实体（job_id）。默认策略 eval_first_greedy
      为本阶段提出的改进策略：先按"多数边集合"确定零代价归属，再用 gain/cost 贪心从 train
      为验证/测试候选人补齐可排序性（每个次要集合带独立的训练边损失预算），其余 job 归给
      边数最多的集合。两侧 ID 分组不一致的交叉边一律进入 excluded，绝不偷偷归入任何集合。
      三种策略（majority_edge / proportional / eval_first_greedy）的实测对比会写入
      manifest 的 strategy_comparison。
    enforce:
      candidate_overlap: 0
      job_overlap: 0
      pair_overlap: 0
    description: "候选人集合两两不相交且岗位集合两两不相交；交叉边单独落盘为 excluded 索引。"

# 重复执行一致性检查：同一配置 + 同一种子必须产出完全一致的划分 ID 与文件哈希。
reproducibility:
  rerun_check: true
  compare: ["split_ids_sha256", "row_counts", "label_stats", "file_sha256"]
