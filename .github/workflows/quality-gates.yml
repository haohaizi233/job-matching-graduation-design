# Phase5-2 可信质量门禁（拆分为两级，禁止硬编码假 PASS）
#
# ── 级别一：core-ci（全新 checkout 即可执行）─────────────────────────────
#   不依赖真实简历、训练数据、模型权重、私有文件、GPU，也不联网下载任何数据集。
#   包含：Python 语法检查 / 领域规则测试 / API 契约测试 / Phase5-1R 可移植测试 /
#         Phase5-1A 架构守卫 / 临时合成夹具数据质量测试 / 隐私与安全门禁 /
#         测试运行器聚合一致性检查 / 完整性检查器自检 / 干净 checkout 可移植性验证。
#
# ── 级别二：artifact-dependent-validation（需要真实产物）──────────────────
#   依赖真实原始数据、训练产物、GPU 或历史模型的检查单独运行，并逐项显式登记
#   状态：PASS / FAIL / BLOCKED / NOT_RUN / ENV_INCOMPATIBLE。
#   纪律：NOT_RUN 与 BLOCKED 与 ENV_INCOMPATIBLE **一律不计入 PASS**；
#         没有真实执行就没有 PASS；旧报告一律不采信（先校验运行身份）。
#
# 运行身份：每个 job 生成唯一 JM_RUN_ID，所有诊断报告必须携带该 run_id 与
# 当前 git commit，消费侧用 scripts/phase5_1a/verify_run_freshness.py 强制校验。
#
# ── Phase5-3 / M1 修复说明 ────────────────────────────────────────────────
#  Core CI 曾把「历史权重不变性」写成 `assert ROOT/"models" 存在`。但 models/**
#  被 .gitignore 忽略、Git 不跟踪，干净 checkout 中必然不存在，导致 quality-gates
#  第 54 次运行（Run 41108847531 / commit cb1f4819）Phase5-1A 25 PASS / 1 FAIL。
#  修复口径：
#    * Core CI 改为**合成夹具自检**——用临时合成文件构造可验证的 SHA-256 基线，
#      断言检查程序确实能发现被修改/被删除的权重文件，且检查过程不修改输入文件；
#    * 真实历史权重完整性移入 Artifact-dependent Validation
#      （scripts/phase5_1a/check_history_weights_integrity.py），
#      缺失产物或无冻结基线时显式 NOT_RUN，**绝不计入 PASS**，也不伪造 checkpoint。
name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_artifact_validation:
        description: "同时执行 Artifact-dependent Validation（需要真实产物）"
        type: boolean
        default: true

jobs:
  # ======================= 级别一：Core CI =======================
  core-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      JM_RUN_ID: core-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依赖安装（服务/测试最小集，版本固定）
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 joblib==1.4.2 \
                      pyyaml==6.0.2 fastapi==0.115.6 pydantic==2.10.4 uvicorn==0.34.0 \
                      httpx==0.28.1 pymupdf==1.24.14 python-docx==1.1.2 \
                      sqlalchemy==2.0.36 alembic==1.14.0 argon2-cffi==23.1.0 \
                      python-multipart==0.0.20

      - name: 语法与导入检查
        run: python -m compileall -q src scripts tests

      - name: 契约与可移植测试（Phase5-1R）
        run: python tests/phase5_1r/run_all.py

      - name: 架构边界与共用规则（Phase5-1A）
        run: python tests/phase5_1a/run_all.py

      - name: API 契约与业务服务测试（Phase5-1）
        run: python tests/phase5_1/run_all.py

      - name: 合成夹具数据质量测试（G0，临时目录，无需真实数据）
        run: python tests/data_pipeline/test_g0_synth_data_quality.py

      - name: 可信 CI 门禁（负向测试 / 运行器一致性 / 隐私安全 / CI 契约）
        run: python tests/core_ci/run_all.py

      - name: 完整性检查器自检（合成冻结夹具，必需 manifest）
        run: |
          python scripts/phase5_1a/check_artifact_integrity.py \
            --root data/independent_eval --glob '**/manifest*.json' \
            --require-manifest --quiet

      - name: 干净 checkout 可移植性验证（证明不依赖真实数据/权重）
        run: python scripts/phase5_1a/verify_fresh_checkout.py

      - name: 上传 Core CI 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ci-evidence
          path: |
            reports/phase5-2/ci/
            reports/phase5-1a/test-results.json
            reports/phase5-1r/test-results.json
            reports/phase5-1/test-results.json
          if-no-files-found: warn

  # ============ 级别二：Artifact-dependent Validation ============
  # 需要真实原始数据 / 训练产物 / GPU / 历史 checkpoint。
  # 每一项都显式登记 PASS / FAIL / BLOCKED / NOT_RUN / ENV_INCOMPATIBLE，
  # NOT_RUN / BLOCKED / ENV_INCOMPATIBLE 不计入 PASS。
  artifact-dependent-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_artifact_validation
    runs-on: ubuntu-latest
    env:
      JM_RUN_ID: artifact-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依赖安装（诊断最小集）
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 joblib==1.4.2 \
                      pyyaml==6.0.2 fastapi==0.115.6 pydantic==2.10.4

      # 关键：不下载任何来源不明的数据集。真实产物必须由人工/独立流程提供。
      - name: 前置产物探测（不下载、不伪造）
        run: |
          echo "data/raw 是否存在: $([ -d data/raw ] && echo yes || echo no)"
          echo "models 是否存在:   $([ -d models ] && echo yes || echo no)"

      # 历史模型权重完整性（A4 硬约束：本轮不得改动历史权重）。
      # 该项属 Artifact-dependent：models/** 被 .gitignore 忽略，干净 checkout 中不存在。
      # 缺失产物 / 无冻结基线 -> NOT_RUN（退出码 0），**绝不计入 PASS**；
      # 有基线且哈希不一致 -> FAIL（退出码 1）。
      - name: 历史权重完整性（Artifact-dependent，缺失即 NOT_RUN）
        run: |
          python scripts/phase5_1a/check_history_weights_integrity.py \
            --out "reports/phase5-3/history-weights-integrity.json"

      - name: 模型兼容诊断（带运行身份，不复用旧报告）
        run: |
          python scripts/phase5_1a/diagnose_model_compat.py \
            --out "reports/phase5-2/ci/model-compatibility.json"

      - name: 消费侧运行身份校验（拒绝采信旧报告）
        run: |
          python scripts/phase5_1a/verify_run_freshness.py \
            "reports/phase5-2/ci/model-compatibility.json" \
            --allow-status "PASS,NOT_RUN,BLOCKED,ENV_INCOMPATIBLE"

      - name: 完整性检查（真实冻结产物，必需 manifest）
        run: |
          python scripts/phase5_1a/check_artifact_integrity.py \
            --root data/independent_eval --glob '**/manifest*.json' \
            --require-manifest --quiet

      - name: Artifact-dependent 状态登记（PASS/FAIL/BLOCKED/NOT_RUN/ENV_INCOMPATIBLE）
        run: |
          # 状态口径（不得同义替换、不得把 NOT_RUN/BLOCKED/ENV_INCOMPATIBLE 计入 PASS）：
          #   PASS             已真实执行且通过
          #   FAIL             已真实执行且失败      -> 本步骤退出非零
          #   BLOCKED          前置条件永久不满足（如 H2 真人 Gold 未到位）
          #   NOT_RUN          前置条件本次不满足（如本机无权重）
          #   ENV_INCOMPATIBLE 执行环境无法执行（如旧 checkpoint 依赖旧版依赖栈）
          python scripts/phase5_1a/summarize_validation.py --run

      - name: 上传 Artifact-dependent 登记表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-validation-evidence
          path: |
            reports/phase5-2/ci/
            reports/phase5-3/
          if-no-files-found: warn

  # ===== 历史模型兼容环境诊断（独立手动，不阻断纯 Python 开发）=====
  model-artifact-compat-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      JM_RUN_ID: manual-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 旧模型兼容环境诊断（独立登记，带运行身份）
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 joblib==1.4.2 pyyaml==6.0.2
          python scripts/phase5_1a/diagnose_model_compat.py \
            --out "reports/phase5-2/ci/model-compatibility-manual.json"
          python scripts/phase5_1a/verify_run_freshness.py \
            "reports/phase5-2/ci/model-compatibility-manual.json" \
            --allow-status "PASS,NOT_RUN,BLOCKED,ENV_INCOMPATIBLE"
          cat "reports/phase5-2/ci/model-compatibility-manual.md"
