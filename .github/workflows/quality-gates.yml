# Phase5-1A 最小质量门禁（纯 Python，无 GPU、无真实简历、无大型训练数据）
#
# 纪律（禁止硬编码假 PASS）：
#   * 每步必须真实执行测试并如实记录 总数/实跑/失败/跳过；
#   * 历史 checkpoint 兼容性检查属"环境相关"，失败要登记不可执行原因，
#     不得把"无法加载权重"表述成"业务逻辑通过"，也不得阻断纯 Python 开发流程。
name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依赖安装（服务/测试最小集）
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 joblib==1.4.2 \
                      pyyaml==6.0.2 fastapi==0.115.6 pydantic==2.10.4 uvicorn==0.34.0 httpx==0.28.1

      - name: 语法与导入检查
        run: python -m compileall -q src scripts tests

      - name: 单元与契约测试（Phase5-1R 151 项）
        run: python tests/phase5_1r/run_all.py

      - name: 架构边界与门禁自检（Phase5-1A 26 项）
        run: python tests/phase5_1a/run_all.py

      - name: API 契约与业务服务测试（Phase5-1 92 项）
        run: python tests/phase5_1/run_all.py

      - name: 研究流程回归（Phase4-3A 237 项）
        run: python tests/phase4_3a/run_all.py

      - name: 数据质量闸门（data_pipeline 74 项）
        run: python tests/data_pipeline/run_all.py

      - name: 隐私与冻结完整性检查
        run: |
          python scripts/phase5_1a/check_artifact_integrity.py

      - name: 历史模型兼容性登记（允许失败，必须如实登记）
        run: |
          python scripts/phase5_1a/diagnose_model_compat.py || true
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("reports/phase5-1a/model-compatibility.json")
          if not p.exists():
              raise SystemExit("模型兼容性报告缺失，必须如实登记不可执行原因")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("model-compatibility summary:", d.get("summary"))
          print("runtime:", d.get("runtime_environment"))
          PY

      - name: 阶段报告一致性检查
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("reports/phase5-1r/test-results.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          t, g = d["totals"], d["groups"]
          checks = {
              "sum_groups_total_eq_totals_tests": sum(s["total"] for s in g.values()) == t["tests"],
              "sum_groups_pass_eq_totals_pass": sum(s["pass"] for s in g.values()) == t["pass"],
              "no_empty_run": t["tests"] > 0,
              "all_groups_legal": set(g) <= {"R1", "R2", "R3", "R4", "R5", "R6"},
          }
          print("report consistency:", checks)
          if not all(checks.values()):
              sys.exit(1)
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            reports/phase5-1r/test-results.json
            reports/phase5-1/test-results.json
            reports/phase4-3a/test-results.json
            reports/phase5-1a/
          if-no-files-found: warn

  # 训练完整性 / GPU 复现属独立的手动工作流，不在纯 Python 门禁内阻断开发
  model-artifact-compat-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 旧模型兼容环境诊断（独立登记）
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 joblib==1.4.2 pyyaml==6.0.2
          python scripts/phase5_1a/diagnose_model_compat.py
          cat reports/phase5-1a/model-compatibility.md
